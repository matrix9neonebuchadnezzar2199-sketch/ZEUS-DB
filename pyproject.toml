[project]
name = "zeusdb"
version = "0.1.0"
description = "Unified SQLite forensic analysis engine (DC3 sqlite-dissect core + multi-algorithm recovery)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
dependencies = [
    "sqlite-dissect",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0",
    "python-multipart>=0.0.9",
]

[project.scripts]
zeusdb = "zeusdb.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "httpx>=0.27.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/zeusdb"]

[tool.uv.sources]
sqlite-dissect = { path = "vendor/sqlite-dissect" }

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "PL", "RUF", "S"]
ignore = ["S101", "PLR0913", "PLR0912", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests", "service"]
show_error_codes = true
mypy_path = ["src"]

[[tool.mypy.overrides]]
module = ["sqlite_dissect.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-q --cov=src/zeusdb --cov-branch --cov-report=term-missing"
testpaths = ["tests"]
